# A plugin SAJÁT fordítási névtere: `codeconjure.foxpost.*`. A fa csoportjai:
#   - `delivery_kind.*`, `address.*`, `checkout.*`, `pickup_point.*` — a boltból
#     a #116 kiszervezéskor átvett kulcsfák;
#   - `channel.*`, `shipping_method.*` — a két admin form extension mezőcímkéi
#     (src/Form/Extension/);
#   - `ui.*` — az admin csomaglista gridje (src/Resources/config/app/grid.yaml)
#     és az admin menüpont (src/Menu/AdminMenuListener.php).
#
# A #192 előtt az utolsó két csoport a host `app.*` névterében élt, vagyis a
# plugin a befogadó bolt kulcsfájába írt, és csak abban az egy boltban volt
# lefordítva, ami maga szállította a kulcsokat. A névtér-szerződést a
# tests/Unit/TranslationNamespaceTest.php őrzi.
#
# Átvéve a bolt messages.hu.yaml-jából (a kulcsfákkal együtt):
#   - sylius.form.shipping_method.delivery_kind.choice.foxpost_home_delivery/
#     foxpost_parcel_locker  -> delivery_kind.foxpost_home_delivery/foxpost_parcel_locker
#     (a leaf-kulcs szándékosan egyezik a mag DeliveryKind::value-jával, l.
#     templates/admin/parcel/_grid_delivery_kind.html.twig)
#   - app.form.foxpost_address                -> address.*
#   - app.form.channel.foxpost_label_page_size(_placeholder) -> channel.label_page_size(_placeholder)
#   - app.checkout.foxpost_home_delivery/foxpost_parcel_locker -> checkout.home_delivery/parcel_locker
#   - app.foxpost.pickup_point.*               -> pickup_point.*
#   - app.ui.foxpost.*                         -> ui.*
# A `shipping_method.default_size(_placeholder)` párnak nem volt bolt-oldali
# fordítása: a mezőcímke mérve nyers kulcsként jelent meg az admin
# szállításimód-űrlapon.
#
# A #193-ban két további kulcs jött, mindkettő a boltból átvett sablonban
# FORDÍTÁS NÉLKÜLI, bedrótozott magyar szöveg volt:
#   - ui.register_parcel    (az admin szállítási panel feladás-gombja)
#   - pickup_point.title    (a rendelés-összegző automata-sora)
#
# A #198-ban három `ui.status.*` kulcs jött: a `FoxpostParcelStatus` 13 esete
# közül a `pending_registration`, a `delivery_failed` és a `returned` fordítás
# NÉLKÜL volt (a boltból így került át). A grid státusz-mezője a #198 óta
# fordítási kulcson át jelenít meg, tehát egy hiányzó kulcs a nyers enum-érték
# kiírását jelentené — az őr a tests/Unit/Admin/ParcelGridFieldRenderTest.php.
