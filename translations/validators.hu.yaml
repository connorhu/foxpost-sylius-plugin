# A 2. lépés FoxPost-mezőinek hibaüzenetei (#199). A `CheckoutShipmentTypeExtension`
# két `NotBlank`-je hivatkozik rájuk; a kötelezőséget a mód dönti el, a
# `SelectShippingTypeExtension` két validációs csoportján keresztül.
#
# A korábbi `codeconjure.foxpost.address` kulcsfa itt MEGSZŰNT: a #99 óta a
# szállítási cím a pénztár 1. lépésén dől el, a Sylius saját
# `differentShippingAddress` kapcsolójával — a FoxPost-oldali címmezők és
# velük a hibaüzeneteik elfogyasztó nélkül maradtak (#199).
codeconjure:
    foxpost:
        checkout:
            phone_number:
                not_blank: 'Kötelező a telefonszám megadása!'
            pickup_point_id:
                not_blank: 'Kötelező csomagpontot választani!'
