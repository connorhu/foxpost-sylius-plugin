# src/Resources/config/app/grid.yaml
# Átvéve: bolt config/packages/_sylius.yaml `app_admin_foxpost_parcel` blokkja
# (1439-1526. sor), szó szerint, két cserével: az osztálynév a plugin
# entitására, a templates: útvonalak a @CodeConjureSyliusFoxPostPlugin/admin/
# parcel/… alakra.
#
# A `deliveryKind` mező HARMADIK, ezen felüli eltérés: a mag DeliveryKind enum
# `->value`-ja slug (pl. `foxpost_home_delivery`), és a Sylius grid `string`
# mezőtípusa a nyers property-t `(string) $value`-vel castolja — ez egy backed
# enum példányon `Error: Object of class ... could not be converted to string`
# hibát dob (lemérve: php -r 'enum F: int {case A=1;} echo (string) F::A;').
# A `type: twig` + saját sablon így NEM választható, hanem KÖTELEZŐ.
sylius_grid:
    grids:
        app_admin_foxpost_parcel:
            driver:
                name: doctrine/orm
                options:
                    class: CodeConjure\SyliusFoxPostPlugin\Entity\FoxpostParcel
                    repository:
                        method: createAdminGridQueryBuilder
            sorting:
                createdAt: desc
            fields:
                orderNumber:
                    type: string
                    label: codeconjure.foxpost.ui.order_number
                    sortable: ~
                barcode:
                    type: string
                    label: codeconjure.foxpost.ui.barcode
                    sortable: ~
                deliveryKind:
                    type: twig
                    label: codeconjure.foxpost.ui.delivery_kind
                    options:
                        template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_delivery_kind.html.twig'
                internalStatus:
                    type: string
                    label: codeconjure.foxpost.ui.status
                    sortable: ~
                createdAt:
                    type: datetime
                    label: sylius.ui.created_at
                    sortable: ~
                labelGeneratedAt:
                    type: datetime
                    label: codeconjure.foxpost.ui.label_generated_at
                    sortable: ~
            filters:
                orderNumber:
                    type: string
                    label: codeconjure.foxpost.ui.order_number
                    options:
                        fields: [orderNumber]
                barcode:
                    type: string
                    label: codeconjure.foxpost.ui.barcode
                    options:
                        fields: [barcode]
                internalStatus:
                    type: select
                    label: codeconjure.foxpost.ui.status
                    form_options:
                        multiple: true
                        choices:
                            codeconjure.foxpost.ui.status.eligible: eligible
                            codeconjure.foxpost.ui.status.validation_failed: validation_failed
                            codeconjure.foxpost.ui.status.registration_failed: registration_failed
                            codeconjure.foxpost.ui.status.registered: registered
                            codeconjure.foxpost.ui.status.label_ready: label_ready
                            codeconjure.foxpost.ui.status.packed: packed
                            codeconjure.foxpost.ui.status.handed_over: handed_over
                            codeconjure.foxpost.ui.status.in_transit: in_transit
                            codeconjure.foxpost.ui.status.delivered: delivered
                            codeconjure.foxpost.ui.status.cancelled: cancelled
            actions:
                item:
                    register:
                        type: links
                        label: codeconjure.foxpost.ui.register
                        options:
                            template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_register_action.html.twig'
                    label:
                        type: links
                        label: codeconjure.foxpost.ui.label
                        options:
                            template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_label_action.html.twig'
                    cancel:
                        type: links
                        label: codeconjure.foxpost.ui.cancel
                        options:
                            template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_cancel_action.html.twig'
                bulk:
                    register:
                        type: links
                        label: codeconjure.foxpost.ui.bulk_register
                        options:
                            template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_bulk_register_action.html.twig'
                    label:
                        type: links
                        label: codeconjure.foxpost.ui.bulk_label
                        options:
                            template: '@CodeConjureSyliusFoxPostPlugin/admin/parcel/_grid_bulk_label_action.html.twig'
