sylius_twig_hooks:
    hooks:
        # A pénztár: a FoxPost csomagautomata-választója a közös
        # codeconjure/sylius-carrier-bundle widget-hookján (#15). ÚJ név, a
        # prepend() nyer. A `pickupPointId` és a `phoneNumber` mezőt, a két
        # szekciót és a láthatóságot a közös csomag adja — a FoxPost csak a
        # választó felületét. A Sylius foglalt `…form.shipments` → `shipment`
        # kulcsát a host a KÖZÖS csomag sablonjára állítja, nem erre a pluginra.
        'sylius_shop.checkout.select_shipping.content.form.shipments.shipment.carrier_fields':
            foxpost:
                template: '@CodeConjureSyliusFoxPostPlugin/shop/checkout/select_shipping/pickup_point_widget.html.twig'

        # A négy admin hook: mind ÚJ név, a prepend() itt is nyer. A pontos
        # nevek és prioritások a bolt git-történetéből (config/packages/
        # _sylius.yaml, a fb31f0d migrációs commit előtti állapot) —
        # karakterre azonosak, csak a sablon útvonala lett rövidebb, mert a
        # plugin lapos admin/channel és admin/shipping_method könyvtárba
        # tette őket (Task 10).
        'sylius_admin.channel.create.content.form.sections.general':
            foxpost_label_page_size:
                template: '@CodeConjureSyliusFoxPostPlugin/admin/channel/foxpost_label_page_size.html.twig'
                priority: -10

        'sylius_admin.channel.update.content.form.sections.general':
            foxpost_label_page_size:
                template: '@CodeConjureSyliusFoxPostPlugin/admin/channel/foxpost_label_page_size.html.twig'
                priority: -10

        'sylius_admin.shipping_method.create.content.form.configuration':
            foxpost_default_size:
                template: '@CodeConjureSyliusFoxPostPlugin/admin/shipping_method/foxpost_default_size.html.twig'
                priority: 140

        'sylius_admin.shipping_method.update.content.form.configuration':
            foxpost_default_size:
                template: '@CodeConjureSyliusFoxPostPlugin/admin/shipping_method/foxpost_default_size.html.twig'
                priority: 140

        # ---- #193: a bolt két admin/bolt sablonjából átvett FoxPost-ágak ----

        # ÚJ hook-név (a `{% hook 'pickup_point' %}`-ot a host rendelés-összegző
        # sablonja hívja, a Sylius nem foglalja), tehát a prepend() itt nyer:
        # ez a bejegyzés ÉL, host-oldali beavatkozás nélkül.
        'sylius_shop.shared.order.show.summary.addresses.shipping.pickup_point':
            foxpost:
                template: '@CodeConjureSyliusFoxPostPlugin/shop/order/summary_pickup_point.html.twig'
                priority: 0

        # Az admin feladás-gomb a közös codeconjure/sylius-carrier-bundle
        # szállító-hookján (#15). ÚJ név, a prepend() nyer. A Sylius foglalt
        # `ship` slotját (`props.template`) a host a KÖZÖS csomag sablonjára
        # állítja; az minden szállítót ebből a hookból rajzol, és ha egyik sem
        # rajzolt (a FoxPost csak a saját módjainál), a Sylius alapgombját.
        'codeconjure_carrier.admin.order.shipment.ship':
            foxpost:
                template: '@CodeConjureSyliusFoxPostPlugin/admin/shipment/ship.html.twig'
